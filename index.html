<!DOCTYPE html> <!--Lucas Lima da Cruz RA:26110686-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaporwave Sum Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <main class="calculator-card">
    <header class="calculator-header">
      <img src="src/Logotipo holográfico Violet Wave Eyewear.png">
      <p class="subtitle">Your vizion your wave</p>
    </header>

    <form id="calc-form" class="calculator-form" onsubmit="return false;">
      <div class="input-group">
        <label for="num1">Quantidade</label>
        <input type="number" id="num1" name="num1" step="any" placeholder="00.00" required autocomplete="off">
      </div>

      <div class="input-group">
        <label for="num2">Valor</label>
        <input type="number" id="num2" name="num2" step="any" placeholder="00.00" required autocomplete="off">
      </div>
      <div class="input-group">
        <label for ="num3">Desconto</label>
        <input type="number" id="num3" name="num3" step="any"
        placeholder="%" required autocomplete="off">
      </div>

      <button type="submit" id="submit-btn" class="vapor-button">
         Total
      </button>
    </form>

    <div class="result-container">
      <span class="result-label">Total com Desconto:</span>
      <div id="result-display" class="result-display">0.00</div>
    </div>
    <div class="result-container">
        <span class="result-label">Total sem Desconto:</span>
        <div id="result-display" class="result-display">0.00</div>
        <div class="imagem">
            <img src="src/4a5fd7d4-d9f4-4c22-a9fe-8db855fffbed.jpg">
          </div>
    </div>    
    <script src="main.js"></script>
  </main>
  

</body>
</html>
